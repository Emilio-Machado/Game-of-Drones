<header class="drones"
  [class.always-flying]="isStartScreen"
  [class.player-one-turn]="activePlayer() === 1"
  [class.player-two-turn]="activePlayer() === 2">
  <img src="dron-left.png" alt="Dron del jugador 1" class="side-to-side left" />
  <h1 (click)="home()" class="title">Juego de Drones</h1>
  <img src="favicon.ico" alt="Dron del jugador 2" class="side-to-side right" />
</header>


<main>
  <router-outlet (activate)="onRouteActivated($event)"></router-outlet>
</main>

<div id="loader" class="none"><img src="loading.gif" alt="Cargando" /></div>
